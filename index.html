<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarteel Clone - Hifz Helper</title>
<style>
body{font-family:sans-serif;background:#f0faf5;text-align:center;padding:20px}
.arabic{font-size:32px;line-height:2;background:white;padding:20px;border-radius:15px;margin:20px 0;direction:rtl}
button{padding:15px 30px;font-size:20px;background:#0d8a5e;color:white;border:none;border-radius:50px;cursor:pointer}
#result{margin-top:20px;padding:15px;background:#fff;border-radius:10px;min-height:50px}
</style>
</head>
<body>
<h2>🕌 Tarteel Clone - Hifz App</h2>
<p>Surah Al-Baqarah Ayat 33</p>

<div class="arabic" id="ayat">
قَالَ يَا آدَمُ أَنبِئْهُم بِأَسْمَائِهِمْ
</div>

<button onclick="startRec()" id="mic">🎙️ Tilawat Shuru Karo</button>
<div id="result">Yahan aap ki tilawat ka text ayega...</div>

<script>
function startRec(){
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech){ alert("Ye browser support nahi karta, Chrome use karo"); return; }
  const rec = new Speech();
  rec.lang = 'ar-SA';
  rec.start();
  document.getElementById('mic').innerText = "Sun raha hun... bolo";

  rec.onresult = function(e){
    const said = e.results[0][0].transcript;
    let check = "";
    if(said.includes("ادم") || said.includes("آدم")){
      check = "<br><br><span style='color:green'>✅ MashaAllah Sahi Hai!</span>";
    } else {
      check = "<br><br><span style='color:red'>❌ Galti! Lafz 'يَا آدَمُ' miss ho gaya, dubara koshish karo</span>";
    }
    document.getElementById('result').innerHTML = "<b>Aap ne parha:</b> " + said + check;
    document.getElementById('mic').innerText = "🎙️ Tilawat Shuru Karo";
  }

  rec.onerror = function(){
    document.getElementById('result').innerText = "Mic ki ijazat do aur dubara try karo";
    document.getElementById('mic').innerText = "🎙️ Tilawat Shuru Karo";
  }
}
</script>
</body>
</html>
