<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hifz Final</title><style>body{background:#f0faf4;text-align:center;padding:10px;font-family:sans-serif}.h{background:#0d8a5e;color:#fff;padding:15px;border-radius:14px}select{padding:12px;margin:4px;border-radius:10px;border:2px solid #0d8a5e;width:48%}#box{background:#fff;padding:25px;border-radius:16px;margin:15px 0;min-height:200px;font-size:33px;line-height:2.8}button{padding:16px 40px;background:#0d8a5e;color:#fff;border:none;border-radius:50px;font-size:20px}#st{background:#fffbe6;padding:12px;border-radius:10px;margin-top:10px}.ok{color:#0d8a5e}.bad{color:#fff;background:red;padding:3px 8px;border-radius:6px;text-decoration:underline wavy yellow 3px}</style></head><body><div class="h"><h3 style="margin:0">🕌 ترتیل - حفظ ٹیسٹ FINAL</h3><small>خالی سے شروع، جو پڑھو گے وہی آئے گا</small></div><select id="p" onchange="loadJ()"></select><select id="s" onchange="loadS()"></select><div id="box">خالی ہے...</div><button onclick="mic()" id="b">🎙️ شروع کرو</button><div id="st">Para select karo</div><script>
let p=document.getElementById('p'),s=document.getElementById('s'),box=document.getElementById('box'),st=document.getElementById('st'),words=[],ci=0,ayahs=[],ai=0,rec=null,list=false,shown=[];
for(let i=1;i<=30;i++){let o=document.createElement('option');o.value=i;o.textContent='Para '+i;if(i==30)o.selected=true;p.appendChild(o)}
let names=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
names.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=(i+1)+'. '+n;s.appendChild(o)})
function render(){if(shown.length==0){box.innerHTML='<span style="color:#aaa">خالی ہے، حفظ سے پڑھو</span>';return}box.innerHTML=shown.map(x=>`<span class="${x.ok?'ok':'bad'}">${x.t}</span>`).join(' ')}
function setA(i){if(i<0||i>=ayahs.length)return;ai=i;words=ayahs[i].text.split(' ').filter(x=>x);ci=0;if(i==0)shown=[];render();st.innerHTML='Ayah '+(ai+1)+' - Hifz se parho'}
function loadJ(){fetch('https://api.alquran.cloud/v1/juz/'+p.value+'/quran-uthmani').then(r=>r.json()).then(d=>{ayahs=d.data.ayahs;setA(0);st.innerHTML='Para '+p.value+' load ho gaya'})}
function loadS(){fetch('https://api.alquran.cloud/v1/surah/'+s.value).then(r=>r.json()).then(d=>{ayahs=d.data.ayahs;setA(0);st.innerHTML=names[s.value-1]+' load'})}
function norm(a){return a.replace(/[ًٌٍَُِّْـ]/g,'').trim()}
function check(sp){if(ci>=words.length){if(ai+1<ayahs.length)setA(ai+1);return}let ex=words[ci];let ok=norm(ex).includes(norm(sp).slice(0,2))||norm(sp).includes(norm(ex).slice(0,2))||norm(ex)==norm(sp);shown.push({t:ex,ok:ok});ci++;render();if(ok){st.innerHTML='✅ '+ex+' sahi';if(ci>=words.length)setTimeout(()=>{if(ai+1<ayahs.length)setA(ai+1)},1000)}else{st.innerHTML='❌ Ghalat! Sahi: <b style="color:red">'+ex+'</b> - Aap ne '+sp+' parha'}}
function mic(){if(list){rec.stop();list=false;b.innerText='🎙️ شروع کرو';b.style.background='#0d8a5e';return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Chrome me kholo');return}rec=new SR();rec.lang='ar-SA';rec.continuous=true;rec.interimResults=false;rec.start();list=true;b.innerText='⏹️ بند کرو';b.style.background='red';st.innerHTML='🎧 Sun raha hun...';rec.onresult=e=>{let last=e.results[e.results.length-1][0].transcript.trim().split(' ').pop();check(last)};rec.onend=()=>{if(list)rec.start()}}
loadJ();
</script></body></html>
