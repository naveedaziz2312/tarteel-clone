<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snake Pro Max V4 Play Store</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/740/740922.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',system-ui;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#020617}
body{display:flex;flex-direction:column}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#0f172a;border-bottom:1px solid #1e293b;flex-shrink:0}
.logo{font-weight:800;font-size:18px}.logo b{color:#22c55e}
.stats{display:flex;gap:8px}.stat{background:#1e293b;border:1px solid #334155;padding:6px 14px;border-radius:999px;font-size:14px;display:flex;gap:6px}.stat span{color:#22c55e;font-weight:700}
.main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(600px 600px at 50% 30%, #132a4d 0%, #0a162e 45%, #020617 100%)}
canvas{display:block;background:transparent;touch-action:none}
#ui{position:absolute;inset:0;background:linear-gradient(180deg,#020617f2,#0f172af5);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:10;transition:.3s}
#ui.hide{opacity:0;pointer-events:none;transform:scale(1.06)}
h1{font-size:44px}h1 span{color:#22c55e}.sub{color:#94a3b8;margin:10px 0 14px}
.skins{display:flex;gap:12px;margin:12px 0}.skin{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer}.skin.active{border-color:#fff;box-shadow:0 0 0 3px #22c55e}
.btn{border:none;padding:14px 26px;border-radius:999px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(180deg,#4ade80,#22c55e);color:#000;font-size:20px;padding:16px 44px;box-shadow:0 10px 30px #22c55e55}.btn-small{background:#1e293b;color:#fff;border:1px solid #334155;padding:10px 16px;font-size:13px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.controls{height:148px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px;background:#0f172a;border-top:1px solid #1e293b;flex-shrink:0}.cbtn{background:#1e293b;border:1px solid #334155;border-radius:20px;color:#e2e8f0;font-size:28px;font-weight:700}.cbtn:active{background:#22c55e;color:#000;transform:scale(.96)}
.settings-btn{position:absolute;top:12px;right:12px;z-index:12;background:#0f172aee;border:1px solid #334155;width:44px;height:44px;border-radius:14px;font-size:20px}
#settings{position:absolute;inset:0;z-index:20;background:#020617f5;backdrop-filter:blur(18px);padding:16px;display:none;overflow:auto}#settings.open{display:block}
.set-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.set-card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:14px;margin-bottom:12px}.set-title{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin-bottom:10px;font-weight:700}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lvl{padding:12px;border-radius:12px;background:#1e293b;border:1px solid #334155;text-align:center;cursor:pointer;font-size:14px}.lvl.active{background:#22c55e;color:#000;border-color:#22c55e;font-weight:800}
.toggles{display:flex;flex-direction:column}.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1e293b}.switch{width:54px;height:30px;background:#334155;border-radius:999px;position:relative;cursor:pointer}.switch.on{background:#22c55e}.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}.switch.on i{left:27px}
.badge{background:#22c55e;color:#000;padding:3px 10px;border-radius:999px;font-size:11px;margin-left:8px;font-weight:800}input.song{width:100%;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px 12px;color:#fff;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div class="logo">🐍 SNAKE <b>PRO MAX V4</b></div><div class="stats"><div class="stat">🍎 <span id="s">0</span></div><div class="stat">👑 <span id="b">0</span></div></div></div>
<div class="main" id="mainBox"><canvas id="c"></canvas><button class="settings-btn" onclick="openSet()">⚙️</button>
<div id="ui"><h1>SNAKE <span>PRO</span></h1><p class="sub">V4 Play Store Ready • 100% Full Screen</p>
<div class="skins"><div class="skin active" style="background:#22c55e" onclick="setSkin('#22c55e',this)"></div><div class="skin" style="background:#38bdf8" onclick="setSkin('#38bdf8',this)"></div><div class="skin" style="background:#facc15" onclick="setSkin('#facc15',this)"></div><div class="skin" style="background:#fb7185" onclick="setSkin('#fb7185',this)"></div><div class="skin" style="background:#a78bfa" onclick="setSkin('#a78bfa',this)"></div></div>
<button class="btn btn-primary" onclick="start()">▶ PLAY NOW</button><div class="row"><button class="btn btn-small" onclick="shareGame()">🚀 Share</button><button class="btn btn-small" onclick="openSet()">⚙️ Levels & Sound</button></div>
<p style="margin-top:12px;color:#475569;font-size:12px">👆 Swipe Anywhere • 🎵 Music • Play Store Ready</p></div>
<div id="settings"><div class="set-head"><h2>⚙️ Settings V4</h2><button class="btn btn-small" onclick="closeSet()">✕</button></div>
<div class="set-card"><div class="set-title">🎮 Level <span class="badge" id="lvlBadge">Medium</span></div><div class="levels">
<div class="lvl" onclick="setLevel(140,this)">🐢 Easy</div><div class="lvl active" onclick="setLevel(90,this)">⚡ Medium</div><div class="lvl" onclick="setLevel(60,this)">🔥 Hard 2x</div><div class="lvl" onclick="setLevel(38,this)">👑 Pro 3x</div></div></div>
<div class="set-card"><div class="set-title">🕹️ Controls</div><div class="levels">
<div class="lvl active" onclick="setCtrl('both',this)">🎯 Both</div><div class="lvl" onclick="setCtrl('swipe',this)">👆 Swipe Only</div><div class="lvl" onclick="setCtrl('joy',this)">🔘 Buttons Only</div><div class="lvl" onclick="setCtrl('hidden',this)">👻 Hidden</div></div></div>
<div class="set-card"><div class="set-title">🔊 Sound</div><div class="toggles">
<div class="tog"><span>🎵 Music</span><div class="switch on" id="swMusic" onclick="togMusic()"><i></i></div></div>
<div class="tog"><span>🔊 Effects</span><div class="switch on" id="swSound" onclick="togSound()"><i></i></div></div>
<div class="tog"><span>📳 Vibration</span><div class="switch on" id="swVib" onclick="togVib()"><i></i></div></div>
</div><input id="songUrl" class="song" placeholder="Apna MP3 link (optional)" onchange="setCustomSong(this.value)"></div>
</div></div>
<div class="controls" id="ctrls"><button class="cbtn" ontouchstart="q('up')" onclick="q('up')">▲</button><div></div><div></div><button class="cbtn" ontouchstart="q('left')" onclick="q('left')">◀</button><button class="cbtn" ontouchstart="q('down')" onclick="q('down')">▼</button><button class="cbtn" ontouchstart="q('right')" onclick="q('right')">▶</button></div>
<audio id="bgAudio" loop preload="auto" crossorigin="anonymous"></audio>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),box=28,cols=20,rows=20,snake=[],dir='right',next='right',food,score=0,best=localStorage.getItem('snakeBest')||0,loop,level=90;
document.getElementById('b').innerText=best;
let settings={sound:true,music:true,vib:true,ctrl:'both',skin:'#22c55e',level:90,song:''};
let audioCtx,musicPlaying=false,bgAudio=document.getElementById('bgAudio');bgAudio.volume=0.25;bgAudio.src='https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3?filename=lofi-study-112191.mp3';
function resize(){let boxEl=document.getElementById('mainBox');let w=boxEl.clientWidth-16,h=boxEl.clientHeight-16;let cell=Math.floor(Math.min(w,h)/20);cell=Math.max(14,Math.min(cell,32));box=cell;cols=20;rows=20;cv.width=box*cols;cv.height=box*rows;draw();}
window.addEventListener('resize',resize);
function getAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}return audioCtx}
function beep(f,d,type='sine',vol=0.18,slide=0){if(!settings.sound)return;let a=getAudio();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function eatSound(){beep(500,0.12,'sine',0.28,900);setTimeout(()=>beep(900,0.15,'sine',0.28,1200),70);if(settings.vib&&navigator.vibrate)navigator.vibrate(50)}
function dieSound(){beep(200,0.35,'sawtooth',0.35,40);setTimeout(()=>beep(80,0.6,'triangle',0.35,30),180);if(settings.vib&&navigator.vibrate)navigator.vibrate([120,60,120])}
function startMusic(){if(!settings.music)return;bgAudio.play().catch(()=>{});}
function stopMusic(){bgAudio.pause();}
function setSkin(c,el){settings.skin=c;document.querySelectorAll('.skin').forEach(x=>x.classList.remove('active'));el.classList.add('active');localStorage.setItem('snakeSkin',c)}
function spawn(){food={x:Math.floor(Math.random()*cols)*box,y:Math.floor(Math.random()*rows)*box};if(snake.some(s=>s.x==food.x&&s.y==food.y))spawn();}
function init(){snake=[{x:10*box,y:10*box},{x:9*box,y:10*box},{x:8*box,y:10*box}];dir='right';next='right';score=0;document.getElementById('s').innerText=0}
function drawGrid(){ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*box,0);ctx.lineTo(i*box,rows*box);ctx.stroke()}for(let j=0;j<=rows;j++){ctx.beginPath();ctx.moveTo(0,j*box);ctx.lineTo(cols*box,j*box);ctx.stroke()}}
function draw(){if(!box)return;ctx.clearRect(0,0,cv.width,cv.height);drawGrid();ctx.shadowBlur=16;ctx.shadowColor=settings.skin;snake.forEach((s,i)=>{ctx.fillStyle=i==0?settings.skin:settings.skin+'cc';ctx.beginPath();let r=box*0.42;ctx.arc(s.x+box/2,s.y+box/2,r,0,Math.PI*2);ctx.fill();if(i==0){ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(s.x+box*0.62,s.y+box*0.38,box*0.09,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s.x+box*0.84,s.y+box*0.38,box*0.09,0,Math.PI*2);ctx.fill();ctx.shadowBlur=16;ctx.shadowColor=settings.skin;}});ctx.shadowBlur=0;ctx.fillStyle='#ff4d5a';ctx.shadowBlur=12;ctx.shadowColor='#ff4d5a';ctx.beginPath();ctx.arc(food.x+box/2,food.y+box/2,box*0.38,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
function q(d){if(d=='left'&&dir!='right')next='left';if(d=='right'&&dir!='left')next='right';if(d=='up'&&dir!='down')next='up';if(d=='down'&&dir!='up')next='down';}
function start(){document.getElementById('ui').classList.add('hide');init();clearInterval(loop);loop=setInterval(tick,settings.level);spawn();startMusic();closeSet();}
function tick(){dir=next;let head={...snake[0]};if(dir=='left')head.x-=box;if(dir=='right')head.x+=box;if(dir=='up')head.y-=box;if(dir=='down')head.y+=box;if(head.x<0||head.x>=box*cols||head.y<0||head.y>=box*rows||snake.some(s=>s.x==head.x&&s.y==head.y)){clearInterval(loop);dieSound();stopMusic();if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('b').innerText=best;}document.getElementById('ui').classList.remove('hide');document.getElementById('ui').querySelector('h1').innerHTML=`<span style="color:#ff4d5a">GAME OVER!</span>`;document.getElementById('ui').querySelector('.sub').innerHTML=`Score: ${score} • Best: ${best}`;document.getElementById('ui').querySelector('.btn-primary').innerText='🔄 PLAY AGAIN';return;}snake.unshift(head);if(head.x==food.x&&head.y==food.y){let mult=level<=60?(level<=38?3:2):1;score+=mult;document.getElementById('s').innerText=score;eatSound();spawn();}else snake.pop();draw();}
function openSet(){document.getElementById('settings').classList.add('open')}function closeSet(){document.getElementById('settings').classList.remove('open')}
function setLevel(l,el){settings.level=l;level=l;el.parentElement.querySelectorAll('.lvl').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('lvlBadge').innerText=el.innerText;localStorage.setItem('snakeLevel',l);if(loop){clearInterval(loop);loop=setInterval(tick,l)}}
function setCtrl(c,el){settings.ctrl=c;let p=document.getElementById('ctrls');el.parentElement.querySelectorAll('.lvl').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(c=='swipe'||c=='hidden'){p.style.display='none'}else{p.style.display='grid';}localStorage.setItem('snakeCtrl',c)}
function togSound(){settings.sound=!settings.sound;document.getElementById('swSound').classList.toggle('on',settings.sound);beep(600,0.12);localStorage.setItem('snakeSound',settings.sound)}
function togMusic(){settings.music=!settings.music;document.getElementById('swMusic').classList.toggle('on',settings.music);if(settings.music)startMusic();else stopMusic();localStorage.setItem('snakeMusic',settings.music)}
function togVib(){settings.vib=!settings.vib;document.getElementById('swVib').classList.toggle('on',settings.vib);if(settings.vib&&navigator.vibrate)navigator.vibrate(40);localStorage.setItem('snakeVib',settings.vib)}
function setCustomSong(url){if(!url)return;settings.song=url;bgAudio.src=url;bgAudio.play().catch(()=>{});localStorage.setItem('snakeSong',url)}
function shareGame(){let t=`🐍 Snake Pro Max V4 Score ${score} Best ${best} - Khelo: https://naveedaziz2312.github.io/tarteel-clone/`;if(navigator.share)navigator.share({title:'Snake Pro Max',text:t});else{navigator.clipboard.writeText(t);alert('Link copied! 🚀')}}
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{if(sx==null)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>20||Math.abs(dy)>20){if(Math.abs(dx)>Math.abs(dy)){if(dx>0)q('right');else q('left')}else{if(dy>0)q('down');else q('up')}}sx=null;sy=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')q('left');if(e.key=='ArrowRight')q('right');if(e.key=='ArrowUp')q('up');if(e.key=='ArrowDown')q('down')});
window.addEventListener('load',()=>{resize();let s=localStorage.getItem('snakeSkin');if(s)settings.skin=s;let l=localStorage.getItem('snakeLevel');if(l){settings.level=parseInt(l);level=parseInt(l)}let mu=localStorage.getItem('snakeMusic');if(mu!==null)settings.music=mu==='true';let so=localStorage.getItem('snakeSound');if(so!==null)settings.sound=so==='true';let vi=localStorage.getItem('snakeVib');if(vi!==null)settings.vib=vi==='true';let song=localStorage.getItem('snakeSong');if(song){settings.song=song;bgAudio.src=song;document.getElementById('songUrl').value=song}document.getElementById('swMusic').className='switch'+(settings.music?' on':'');document.getElementById('swSound').className='switch'+(settings.sound?' on':'');document.getElementById('swVib').className='switch'+(settings.vib?' on':'');drawGrid();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>console.log('SW Ready Play Store'))}
</script>
</body>
</html>
