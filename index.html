<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tarteel Pro</title><style>body{font-family:sans-serif;background:#f6fdf9;margin:0;padding:12px;text-align:center}.header{background:#0d8a5e;color:white;padding:14px;border-radius:14px}select{padding:12px;margin:6px;border-radius:10px;border:2px solid #0d8a5e;width:46%}.box{background:white;padding:18px;border-radius:14px;margin:12px 0;min-height:140px;font-size:26px;line-height:2.1}.word{display:inline-block;margin:4px}.wrong{color:red;text-decoration:underline wavy red 3px;background:#ffeaea}.correct{color:#0d8a5e}button{padding:15px 35px;font-size:19px;background:#0d8a5e;color:white;border:none;border-radius:50px}#trans{font-size:20px;background:#fffbe6;padding:12px;border-radius:10px;min-height:50px}</style></head><body><div class="header"><h3 style="margin:0">🕌 ترتیل پرو - حافظ</h3><small>Para / Surah select karo</small></div><select id="para" onchange="loadJuz()"><option value="30" selected>Para 30 - عم</option><option value="29">Para 29 - تبارك</option><option value="1">Para 1 - الم</option><option value="2">Para 2 - سيقول</option><option value="3">Para 3 - تلك الرسل</option></select><select id="surah" onchange="loadSurah()"><option value="78">Naba</option><option value="36">Yaseen</option><option value="67">Mulk</option><option value="112">Ikhlas</option></select><div class="box" id="qText">Loading...</div><button onclick="start()" id="btn">🎙️ Tilawat Shuru</button><div id="trans">Aap jo parhoge yahan ayega...</div><script>let orig=[];function show(t){orig=t.split(" ");document.getElementById('qText').innerHTML=orig.map((w,i)=>`<span class='word' id='w${i}'>${w}</span>`).join(" ")}function loadJuz(){let p=document.getElementById('para').value;fetch(`https://api.alquran.cloud/v1/juz/${p}/quran-uthmani`).then(r=>r.json()).then(d=>show(d.data.ayahs.slice(0,4).map(a=>a.text).join(" ")))}function loadSurah(){let s=document.getElementById('surah').value;fetch(`https://api.alquran.cloud/v1/surah/${s}`).then(r=>r.json()).then(d=>show(d.data.ayahs.slice(0,4).map(a=>a.text).join(" ")))}function start(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new S();r.lang='ar-SA';r.continuous=true;r.interimResults=true;r.start();document.getElementById('btn').innerText="⏹️ Sun raha hun...";document.getElementById('btn').style.background="red";r.onresult=e=>{let txt="";for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript+" ";document.getElementById('trans').innerHTML="Aap: "+txt;txt.split(" ").forEach((w,i)=>{let el=document.getElementById('w'+i);if(el){let ok=orig[i]&&(orig[i].includes(w.slice(0,2))||w.includes(orig[i].slice(0,2)));el.className= ok?"word correct":"word wrong"}})}; r.onend=()=>{document.getElementById('btn').innerText="🎙️ Tilawat Shuru";document.getElementById('btn').style.background="#0d8a5e"}}loadJuz();</script></body></html>  . Code ye he
